name: Renovar token de Instagram
# Solo para tokens de Instagram Login (caducan a los 60 días). Con token de usuario
# del sistema (no caduca) no hace falta: queda solo manual.
on:
  workflow_dispatch: {}
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        env: { IG_TOKEN: "${{ secrets.IG_TOKEN }}" }
        run: python renovar_token.py
      - name: Guardar token nuevo como secreto
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NUEVO: ${{ steps.r.outputs.token }}
        run: |
          echo "::add-mask::$NUEVO"
          gh secret set IG_TOKEN --body "$NUEVO" --repo "$GITHUB_REPOSITORY"
